<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reader Reach — Admin</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Georgia,"Times New Roman",serif;
    background:#f7f1e8;
    color:#3d2b22;
}

button{
    font-family:inherit;
    cursor:pointer;
}

.admin-layout{
    display:flex;
    min-height:100vh;
}

/* SIDEBAR */

.sidebar{
    width:250px;
    background:#3d2b22;
    color:white;
    padding:28px 18px;
    position:fixed;
    left:0;
    top:0;
    bottom:0;
}

.logo{
    font-size:26px;
    font-weight:bold;
    margin-bottom:5px;
}

.logo-sub{
    color:#d9c5a5;
    font-size:13px;
    margin-bottom:40px;
}

.nav-btn{
    display:block;
    width:100%;
    padding:13px 15px;
    margin-bottom:7px;
    border:0;
    border-radius:8px;
    background:transparent;
    color:#f8f2e9;
    text-align:left;
    font-size:15px;
}

.nav-btn:hover,
.nav-btn.active{
    background:#695044;
}

.sidebar-bottom{
    position:absolute;
    left:18px;
    right:18px;
    bottom:25px;
}

.signout{
    width:100%;
    padding:12px;
    border:1px solid #8b7568;
    border-radius:8px;
    background:transparent;
    color:white;
}

/* MAIN */

.main{
    margin-left:250px;
    width:calc(100% - 250px);
    padding:35px;
}

.topbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:30px;
}

.topbar h1{
    font-size:32px;
}

.topbar p{
    color:#7b665b;
    margin-top:5px;
}

.refresh{
    background:#3d2b22;
    color:white;
    border:0;
    padding:11px 18px;
    border-radius:8px;
}

/* STATS */

.stats{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:18px;
    margin-bottom:30px;
}

.stat{
    background:white;
    padding:23px;
    border-radius:12px;
    box-shadow:0 4px 15px rgba(61,43,34,.08);
}

.stat-label{
    color:#806b5e;
    font-size:13px;
    margin-bottom:10px;
}

.stat-number{
    font-size:30px;
    font-weight:bold;
}

/* SECTIONS */

.section{
    background:white;
    border-radius:12px;
    padding:25px;
    margin-bottom:25px;
    box-shadow:0 4px 15px rgba(61,43,34,.07);
}

.section-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
}

.section-header h2{
    font-size:23px;
}

table{
    width:100%;
    border-collapse:collapse;
}

th,
td{
    text-align:left;
    padding:14px 10px;
    border-bottom:1px solid #eee5da;
    font-size:14px;
}

th{
    color:#806b5e;
    font-size:12px;
    text-transform:uppercase;
}

.status{
    display:inline-block;
    padding:5px 9px;
    border-radius:20px;
    font-size:12px;
    background:#f2e9dc;
}

.status.approved{
    background:#e5f0e5;
    color:#386238;
}

.status.denied,
.status.rejected{
    background:#f4e2df;
    color:#8a3d34;
}

.actions{
    display:flex;
    gap:7px;
    flex-wrap:wrap;
}

.action-btn{
    border:0;
    border-radius:6px;
    padding:7px 10px;
    font-size:12px;
}

.approve{
    background:#405b40;
    color:white;
}

.deny,
.reject{
    background:#8a4339;
    color:white;
}

.view{
    background:#e9dfd2;
    color:#3d2b22;
}

.empty{
    text-align:center;
    padding:35px 15px;
    color:#88766a;
}

/* LOGIN */

.login-screen{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    background:#f7f1e8;
}

.login-box{
    background:white;
    width:100%;
    max-width:420px;
    padding:40px;
    border-radius:14px;
    box-shadow:0 8px 35px rgba(61,43,34,.12);
}

.login-box h1{
    margin-bottom:7px;
}

.login-box p{
    color:#806b5e;
    margin-bottom:25px;
}

.login-box input{
    width:100%;
    padding:13px;
    border:1px solid #d9cabc;
    border-radius:8px;
    margin-bottom:14px;
    font-family:inherit;
}

.login-btn{
    width:100%;
    padding:13px;
    border:0;
    border-radius:8px;
    background:#3d2b22;
    color:white;
    font-size:15px;
}

.error{
    color:#a0443a;
    font-size:13px;
    margin-top:12px;
}

/* MODAL */

.modal{
    position:fixed;
    inset:0;
    background:rgba(30,20,15,.55);
    display:none;
    align-items:center;
    justify-content:center;
