<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reader Reach — Join</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
    font-family:Georgia,"Times New Roman",serif;
    background:#f8f2e9;
    color:#3d2b22;
    min-height:100vh;
}

header{
    padding:22px 7%;
    background:#fffdf8;
    border-bottom:1px solid #eadfd2;
}

.logo{
    font-size:25px;
    font-weight:bold;
}

.logo span{color:#9a7655}

main{
    max-width:850px;
    margin:50px auto;
    padding:0 20px;
}

.card{
    background:white;
    padding:40px;
    border-radius:16px;
    box-shadow:0 8px 30px rgba(61,43,34,.09);
}

h1{
    font-size:36px;
    margin-bottom:10px;
}

.intro{
    color:#766257;
    line-height:1.7;
    margin-bottom:30px;
}

.role-title{
    font-size:18px;
    margin-bottom:15px;
}

.roles{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:15px;
    margin-bottom:30px;
}

.role{
    padding:22px;
    border:2px solid #e4d7c9;
    border-radius:12px;
    background:#fffdf8;
    cursor:pointer;
    text-align:left;
    transition:.2s;
}

.role:hover,
.role.selected{
    border-color:#8b684d;
    background:#f8f0e5;
}

.role strong{
    display:block;
    font-size:19px;
    margin-bottom:7px;
}

.role small{
    color:#79665a;
    line-height:1.5;
}

form{
    display:none;
}

label{
    display:block;
    margin:17px 0 7px;
    font-size:14px;
    font-weight:bold;
}

input{
    width:100%;
    padding:14px;
    border:1px solid #d8cabc;
    border-radius:8px;
    font-family:inherit;
    font-size:15px;
}

button{
    font-family:inherit;
    cursor:pointer;
}

.submit{
    width:100%;
    margin-top:25px;
    padding:14px;
    border:0;
    border-radius:8px;
    background:#3d2b22;
    color:white;
    font-size:16px;
}

.submit:hover{
    background:#594238;
}

.message{
    display:none;
    margin-top:20px;
    padding:15px;
    border-radius:9px;
    line-height:1.6;
}

.success{
    display:block;
    background:#edf5eb;
    color:#315a35;
}

.error{
    display:block;
    background:#f8e9e5;
    color:#8b3d35;
}

.switch{
    text-align:center;
    margin-top:22px;
    color:#77665c;
}

.switch a{
    color:#6d4b35;
    font-weight:bold;
    text-decoration:none;
}

.back{
    display:inline-block;
    margin-top:25px;
    color:#6d4b35;
    text-decoration:none;
}

@media(max-width:650px){
    .roles{grid-template-columns:1fr}
    .card{padding:25px}
    h1{font-size:29px}
}
</style>
</head>

<body>

<header>
    <div class="logo">
        Reader <span>Reach</span>
    </div>
</header>

<main>

<div class="card">

    <h1>Join Reader Reach</h1>

    <p class="intro">
        Reader Reach connects authors and readers through thoughtful
        discovery, book information, and protected reading experiences.
        Choose how you would like to join.
    </p>

    <div class="role-title">
        <strong>Are you a reader or an author?</strong>
    </div>

    <div class="roles">

        <button type="button"
                class="role"
                id="readerRole"
                onclick="chooseRole('reader')">

            <strong>📖 I'm a Reader</strong>

            <small>
                Discover approved books and access reading experiences
                available through Reader Reach.
            </small>

        </button>

        <button type="button"
                class="role"
                id="authorRole"
                onclick="chooseRole('author')">

            <strong>✍️ I'm an Author</strong>

            <small>
                Submit your book information and introduce your work
                to readers through Reader Reach.
            </small>

        </button>

    </div>


    <form id="joinForm">

        <label for="email">Email Address</label>

        <input
            type="email"
            id="email"
            placeholder="you@example.com"
            required
        >

        <label for="password">Create Password</label>

        <input
            type="password"
            id="password"
            placeholder="At least 6 characters"
            minlength="6"
            required
        >

        <button class="submit" type="submit">
            Submit Access Request →
        </button>

    </form>


    <div id="message" class="message"></div>

    <div class="switch">
        Already have an account?
        <a href="#" onclick="showLogin(event)">Sign in</a>
    </div>

    <a class="back" href="../">
        ← Back to Reader Reach
    </a>

</div>

</main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
    "https://xeoxlgkfgukcxwwcndqt.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_bMm3mNKrb0szy2Wm3rQWSw_ZVcdjRmV";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );

let selectedRole = "";


/* CHOOSE ROLE */

function chooseRole(role){

    selectedRole = role;

    document
        .getElementById("readerRole")
        .classList.toggle(
            "selected",
            role === "reader"
        );

    document
        .getElementById("authorRole")
        .classList.toggle(
            "selected",
            role === "author"
        );

    document
        .getElementById("joinForm")
        .style.display = "block";

    document
        .getElementById("message")
        .style.display = "none";

}


/* SUBMIT */

document
.getElementById("joinForm")
.addEventListener("submit", async function(e){

    e.preventDefault();

    const email =
        document.getElementById("email")
        .value
        .trim()
        .toLowerCase();

    const password =
        document.getElementById("password")
        .value;

    const message =
        document.getElementById("message");

    if(!selectedRole){

        showMessage(
            "Please choose Reader or Author first.",
            "error"
        );

        return;
    }


    message.className = "message";
    message.style.display = "block";
    message.textContent =
        "Submitting your access request...";


    /*
       First create the access request.
    */

    const {
        data: request,
        error: requestError
    } = await supabaseClient
        .from("access_requests")
        .insert({
            email: email,
            role: selectedRole,
            status: "pending"
        })
        .select()
        .single();


    if(requestError){

        /*
          If this email already has a pending request,
          continue to account creation instead of creating
          a duplicate request.
        */

        if(
            requestError.code === "23505"
        ){

            showMessage(
                "An access request may already exist for this email. You can continue by creating your account.",
                "error"
            );

        }else{

            showMessage(
                "We could not submit your request: " +
                requestError.message,
                "error"
            );

            return;
        }

    }


    /*
       Create the Supabase account.
    */

    const {
        data,
        error
    } = await supabaseClient.auth.signUp({
        email: email,
        password: password
    });


    if(error){

        if(
            error.message.toLowerCase()
            .includes("already registered")
        ){

            showMessage(
                "Your access request was received. This email already has an account. Please use Sign in after your request is approved.",
                "success"
            );

        }else{

            showMessage(
                "Your request was submitted, but account creation returned: " +
                error.message,
                "error"
            );

        }

        return;
    }


    /*
       If Supabase returned a user, try to link the
       profile to the request. This is allowed by the
       profile update policy we created.
    */

    if(
        data &&
        data.user &&
        request
    ){

        await supabaseClient
            .from("profiles")
            .update({
                access_request_id: request.id
            })
            .eq("id", data.user.id);

    }


    showMessage(
        "Your access request has been submitted successfully. Reader Reach will review your request. If email confirmation is required, check your inbox and confirm your email.",
        "success"
    );


    document
        .getElementById("joinForm")
        .reset();

});


/* LOGIN */

function showLogin(event){

    if(event){
        event.preventDefault();
    }

    window.location.href =
        "../account/login.html";

}


/* MESSAGE */

function showMessage(text,type){

    const box =
        document.getElementById("message");

    box.className =
        "message " + type;

    box.style.display =
        "block";

    box.textContent =
        text;

}

</script>

</body>
</html>
