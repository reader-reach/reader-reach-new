<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password | Reader Reach</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../config.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #fffdf8;
      color: #3d2b22;
      font-family: Georgia, "Times New Roman", serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 25px;
    }

    .box {
      width: 100%;
      max-width: 500px;
      background: white;
      padding: 50px 42px;
      border-radius: 22px;
      box-shadow: 0 20px 60px rgba(61, 43, 34, 0.13);
    }

    .brand {
      text-align: center;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: #765747;
      font-family: Arial, sans-serif;
      font-size: 13px;
      margin-bottom: 28px;
    }

    h1 {
      text-align: center;
      font-size: 36px;
      font-weight: normal;
      color: #4b2d20;
      margin: 0 0 12px;
    }

    .intro {
      text-align: center;
      color: #725b4e;
      font-family: Arial, sans-serif;
      line-height: 1.6;
      font-size: 14px;
      margin-bottom: 30px;
    }

    label {
      display: block;
      margin: 18px 0 8px;
      font-family: Arial, sans-serif;
      font-size: 14px;
      font-weight: 600;
    }

    .password-box {
      position: relative;
    }

    input {
      width: 100%;
      padding: 15px;
      padding-right: 70px;
      border: 1px solid #ddcfc5;
      border-radius: 10px;
      background: #fffdf8;
      color: #3d2b22;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #9a735b;
      box-shadow: 0 0 0 3px rgba(154, 115, 91, .12);
    }

    .show {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      border: 0;
      background: transparent;
      color: #765747;
      cursor: pointer;
      font-size: 13px;
    }

    .update {
      width: 100%;
      margin-top: 28px;
      padding: 16px;
      border: 0;
      border-radius: 10px;
      background: #4b2d20;
      color: white;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }

    .update:hover {
      background: #63402e;
    }

    .update:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .message {
      display: none;
      margin-top: 18px;
      padding: 14px;
      border-radius: 9px;
      font-family: Arial, sans-serif;
      font-size: 14px;
      line-height: 1.5;
    }

    .success {
      display: block;
      background: #eef7ed;
      color: #315b2d;
    }

    .error {
      display: block;
      background: #fceeee;
      color: #8a3028;
    }

    .login {
      text-align: center;
      margin-top: 25px;
      font-family: Arial, sans-serif;
      font-size: 14px;
    }

    .login a {
      color: #4b2d20;
      font-weight: 600;
      text-decoration: none;
    }

    .login a:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body>

  <div class="box">

    <div class="brand">Reader Reach</div>

    <h1>Create New Password</h1>

    <p class="intro">
      Choose a new password for your Reader Reach account.
    </p>

    <form id="resetForm">

      <label for="password">New password</label>

      <div class="password-box">
        <input
          id="password"
          type="password"
          placeholder="Enter your new password"
          autocomplete="new-password"
          minlength="6"
          required
        >

        <button
          type="button"
          class="show"
          id="showPassword"
        >
          Show
        </button>
      </div>


      <label for="confirmPassword">Confirm new password</label>

      <div class="password-box">
        <input
          id="confirmPassword"
          type="password"
          placeholder="Enter your new password again"
          autocomplete="new-password"
          minlength="6"
          required
        >

        <button
          type="button"
          class="show"
          id="showConfirm"
        >
          Show
        </button>
      </div>


      <button
        type="submit"
        class="update"
        id="updateButton"
      >
        Update Password
      </button>

    </form>

    <div id="message" class="message"></div>

    <div class="login">
      <a href="./login.html">← Back to Sign In</a>
    </div>

  </div>


<script>

  const config = window.READER_REACH_CONFIG;

  if (
    !config ||
    !config.SUPABASE_URL ||
    !config.SUPABASE_ANON_KEY
  ) {
    throw new Error("Reader Reach configuration is missing.");
  }


  const supabaseClient =
    window.supabase.createClient(
      config.SUPABASE_URL,
      config.SUPABASE_ANON_KEY
    );


  const resetForm =
    document.getElementById("resetForm");

  const password =
    document.getElementById("password");

  const confirmPassword =
    document.getElementById("confirmPassword");

  const updateButton =
    document.getElementById("updateButton");

  const message =
    document.getElementById("message");


  function showMessage(text, type) {

    message.textContent = text;
    message.className = "message " + type;

  }


  document
    .getElementById("showPassword")
    .addEventListener("click", function () {

      if (password.type === "password") {
        password.type = "text";
        this.textContent = "Hide";
      } else {
        password.type = "password";
        this.textContent = "Show";
      }

    });


  document
    .getElementById("showConfirm")
    .addEventListener("click", function () {

      if (confirmPassword.type === "password") {
        confirmPassword.type = "text";
        this.textContent = "Hide";
      } else {
        confirmPassword.type = "password";
        this.textContent = "Show";
      }

    });


  resetForm.addEventListener("submit", async function (event) {

    event.preventDefault();

    const newPassword = password.value;
    const confirmation = confirmPassword.value;


    if (newPassword.length < 6) {

      showMessage(
        "Your password must be at least 6 characters long.",
        "error"
      );

      return;
    }


    if (newPassword !== confirmation) {

      showMessage(
        "The passwords do not match.",
        "error"
      );

      return;
    }


    updateButton.disabled = true;
    updateButton.textContent = "Updating...";
    message.className = "message";


    try {

      const { data: sessionData } =
        await supabaseClient.auth.getSession();


      if (!sessionData.session) {

        throw new Error(
          "This password reset link is no longer active. Please request a new reset link."
        );

      }


      const { error } =
        await supabaseClient.auth.updateUser({
          password: newPassword
        });


      if (error) {
        throw error;
      }


      showMessage(
        "Your password has been updated successfully. You can now sign in with your new password.",
        "success"
      );


      resetForm.reset();

      updateButton.textContent = "Password Updated";


      setTimeout(function () {

        window.location.href = "./login.html";

      }, 2500);


    } catch (error) {

      console.error(
        "Password update error:",
        error
      );

      showMessage(
        error.message ||
        "Unable to update your password. Please request a new reset link.",
        "error"
      );

      updateButton.disabled = false;
      updateButton.textContent = "Update Password";

    }

  });

</script>

</body>
</html>
